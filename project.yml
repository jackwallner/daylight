name: Daylight
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  Daylight:
    build:
      targets:
        Daylight: all
        DaylightWatch: all
        DaylightTests: [test]
    test:
      targets:
        - DaylightTests
      config: Debug
      storeKitConfiguration: Daylight.storekit
    run:
      config: Debug
      storeKitConfiguration: Daylight.storekit
  DaylightWatch:
    build:
      targets:
        DaylightWatch: all
    run:
      config: Debug

targets:
  Daylight:
    type: application
    platform: iOS
    sources:
      - path: Daylight/App.swift
      - path: Daylight/Views/DaylightViews.swift
      - path: Daylight/Assets.xcassets
      - path: Daylight/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Daylight.storekit
        buildPhase: resources
      - path: Shared/Models/DaylightRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Services/GoalSettings.swift
      - path: Shared/Services/HealthKitService.swift
      - path: Shared/Services/LocationService.swift
      - path: Shared/Services/NotificationService.swift
      - path: Shared/Services/StoreService.swift
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Utilities/AppStoreReviewLinks.swift
      - path: Shared/Utilities/ConversionCopy.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/DaylightSummary.swift
      - path: Shared/Utilities/SolarCalculator.swift
      - path: Shared/Utilities/DaylightFormat.swift
      - path: Shared/Utilities/ScreenshotConfig.swift
      - path: Shared/Utilities/ScreenshotFixtures.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.daylight
        PRODUCT_NAME: Daylight
        INFOPLIST_FILE: Daylight/Info.plist
        CODE_SIGN_ENTITLEMENTS: Daylight/Daylight.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: DaylightWidget
      - target: DaylightWatch
        embed: true

  DaylightWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DaylightWidget/DaylightWidget.swift
      - path: DaylightWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/DaylightRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/DaylightSummary.swift
      - path: Shared/Utilities/SolarCalculator.swift
      - path: Shared/Utilities/DaylightFormat.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.daylight.widget
        INFOPLIST_FILE: DaylightWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DaylightWidget/DaylightWidget.entitlements

  DaylightWatch:
    type: application
    platform: watchOS
    sources:
      - path: DaylightWatch/App.swift
      - path: DaylightWatch/Views/WatchDaylightView.swift
      - path: DaylightWatch/Assets.xcassets
      - path: DaylightWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/DaylightRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Services/GoalSettings.swift
      - path: Shared/Services/HealthKitService.swift
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/DaylightSummary.swift
      - path: Shared/Utilities/SolarCalculator.swift
      - path: Shared/Utilities/DaylightFormat.swift
      - path: Shared/Utilities/ScreenshotConfig.swift
      - path: Shared/Utilities/ScreenshotFixtures.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.daylight.watch
        INFOPLIST_FILE: DaylightWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: DaylightWatch/DaylightWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: DaylightWatchWidget

  DaylightWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: DaylightWatchWidget/WatchComplication.swift
      - path: DaylightWatchWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/DaylightRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/DaylightSummary.swift
      - path: Shared/Utilities/SolarCalculator.swift
      - path: Shared/Utilities/DaylightFormat.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.daylight.watch.widget
        INFOPLIST_FILE: DaylightWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DaylightWatchWidget/DaylightWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  DaylightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaylightTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.daylight.tests
    dependencies:
      - target: Daylight
